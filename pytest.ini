[pytest]
# Pytest configuration for Northbound Script Generator

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Add options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers
    --strict-markers
    # Strict config
    --strict-config
    # Show warnings
    -W default
    # Coverage options (when --cov is used)
    --cov-branch
    --cov-report=term-missing:skip-covered
    # Timeout for tests (in seconds)
    --timeout=300
    # Fail on first error (comment out for full test run)
    # -x

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests with external systems
    e2e: End-to-end workflow tests
    performance: Performance and load tests
    slow: Tests that take a long time to run
    network: Tests that require network connectivity
    ryu: Tests that require RYU controller
    comnetsemu: Tests that require ComnetsEMU
    property: Property-based tests using Hypothesis
    smoke: Quick smoke tests for basic functionality

# Coverage configuration
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
