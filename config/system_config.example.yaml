# System Configuration Example
# Copy this file to system_config.yaml and customize for your environment

version: "1.0.0"
environment: "development"  # development, staging, production
debug: false

# RYU Controller Configuration
ryu:
  host: "localhost"
  port: 8080
  api_version: "v1.0"
  timeout_seconds: 30
  max_retries: 3
  ssl_enabled: false
  ssl_verify: true
  connection_pool_size: 10

# ComnetsEMU Configuration
comnets:
  host: "localhost"
  port: 6653
  protocol: "openflow"  # openflow or netconf
  version: "1.3"
  connection_pool_size: 10
  timeout_seconds: 30

# Monitoring Configuration
monitoring:
  metrics_interval_seconds: 60
  retention_days: 30
  alert_thresholds:
    cpu_usage_percent: 90.0
    memory_usage_percent: 90.0
    error_rate_percent: 5.0
    response_time_p95_ms: 1000.0
  prometheus_enabled: true
  prometheus_port: 9090
  influxdb_enabled: true
  influxdb_url: "http://localhost:8086"
  influxdb_token: null
  influxdb_org: "northbound"
  influxdb_bucket: "metrics"

# API Gateway Configuration
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false
  cors_enabled: true
  cors_origins:
    - "*"
  rate_limit_enabled: true
  rate_limit_requests: 100
  jwt_secret_key: "change-me-in-production"
  jwt_algorithm: "HS256"
  jwt_expiration_minutes: 30

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  structured: true  # Enable JSON structured logging
  file_enabled: true
  file_path: "./logs/northbound.log"
  file_rotation_enabled: true
  file_max_bytes: 10485760  # 10MB
  file_backup_count: 5
  console_enabled: true
  syslog_enabled: false
  syslog_host: "localhost"
  syslog_port: 514
  filters:
    # Per-component log level overrides
    # "ConfigManager": "DEBUG"
    # "RYUConnector": "WARNING"

# Backup Configuration
backup:
  enabled: true
  directory: "./backups"
  retention_days: 7
  compression_enabled: true
  encryption_enabled: false
  schedule_cron: "0 * * * *"  # Every hour

# Global Retry and Resilience
max_retries: 3
retry_delay: 2.0
enable_rollback: true

# Performance Settings
connection_pool_size: 10
request_timeout: 30
