version: '3.8'

services:
  llm-module:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-integration-module
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
      - "${METRICS_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JSON_LOGS=${JSON_LOGS:-true}
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - METRICS_PORT=8000
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-2000}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.1}
      - OPENAI_RATE_LIMIT_RPM=${OPENAI_RATE_LIMIT_RPM:-60}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-30}
      - OPENAI_MAX_RETRIES=${OPENAI_MAX_RETRIES:-3}
      - STATE_CACHE_TTL=${STATE_CACHE_TTL:-300}
      - STATE_REFRESH_INTERVAL=${STATE_REFRESH_INTERVAL:-60}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - NOTIFICATIONS_ENABLED=${NOTIFICATIONS_ENABLED:-true}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - SLACK_ENABLED=${SLACK_ENABLED:-false}
      - WEBHOOK_ENABLED=${WEBHOOK_ENABLED:-false}
      - BUDGET_ALERTS_ENABLED=${BUDGET_ALERTS_ENABLED:-true}
    volumes:
      - ./cache:/app/cache
      - ./output:/app/output
      - ./logs:/app/logs
    networks:
      - llm-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  llm-network:
    driver: bridge
