apiVersion: v1
kind: Secret
metadata:
  name: northbound-secrets
  namespace: northbound
type: Opaque
stringData:
  # Database credentials
  POSTGRES_PASSWORD: "changeme-in-production"
  
  # Redis password
  REDIS_PASSWORD: "changeme-in-production"
  
  # InfluxDB credentials
  INFLUXDB_PASSWORD: "changeme-in-production"
  INFLUXDB_TOKEN: "my-super-secret-token-change-in-production"
  
  # JWT secret
  JWT_SECRET_KEY: "your-secret-key-change-in-production"
  
  # Grafana password
  GRAFANA_PASSWORD: "admin-change-in-production"

---
# Note: In production, use external secret management like:
# - Kubernetes Secrets with encryption at rest
# - HashiCorp Vault
# - AWS Secrets Manager
# - Azure Key Vault
# - Google Secret Manager
#
# Example with external secrets operator:
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: northbound-secrets
#   namespace: northbound
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: vault-backend
#     kind: SecretStore
#   target:
#     name: northbound-secrets
#   data:
#   - secretKey: POSTGRES_PASSWORD
#     remoteRef:
#       key: northbound/postgres
#       property: password
