apiVersion: v1
kind: Secret
metadata:
  name: llm-secrets
type: Opaque
stringData:
  # OpenAI API Key
  # Get your key from: https://platform.openai.com/api-keys
  openai-api-key: "your-openai-api-key-here"
  
  # JWT Secret Key
  # Generate with: python scripts/secrets_manager.py generate-jwt
  jwt-secret-key: "your-jwt-secret-key-here"
  
  # Admin Password
  admin-password: "change-this-password"
  
  # Operator Password
  operator-password: "change-this-password"
  
  # Viewer Password
  viewer-password: "change-this-password"
  
  # SMTP Password (if email notifications enabled)
  smtp-password: "your-smtp-password"
  
  # Slack Webhook URL (if Slack notifications enabled)
  slack-webhook-url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

---
# To create the secret from this file:
# 1. Copy this file: cp k8s/secrets-template.yaml k8s/secrets.yaml
# 2. Edit k8s/secrets.yaml with your actual secrets
# 3. Apply: kubectl apply -f k8s/secrets.yaml
# 4. Delete the file: rm k8s/secrets.yaml (don't commit it!)

# Alternative: Create secret from command line
# kubectl create secret generic llm-secrets \
#   --from-literal=openai-api-key='sk-...' \
#   --from-literal=jwt-secret-key='your-secret' \
#   --from-literal=admin-password='secure-password'
