apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-integration-module
  labels:
    app: llm-integration-module
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-integration-module
  template:
    metadata:
      labels:
        app: llm-integration-module
        version: v1
    spec:
      containers:
      - name: llm-module
        image: llm-integration-module:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8000
          name: metrics
          protocol: TCP
        env:
        - name: DEBUG
          value: "false"
        - name: LOG_LEVEL
          value: "INFO"
        - name: JSON_LOGS
          value: "true"
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8080"
        - name: METRICS_PORT
          value: "8000"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: openai-api-key
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: jwt-secret-key
        - name: OPENAI_MODEL
          valueFrom:
            configMapKeyRef:
              name: llm-config
              key: openai-model
        - name: OPENAI_MAX_TOKENS
          valueFrom:
            configMapKeyRef:
              name: llm-config
              key: openai-max-tokens
        - name: STATE_CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: llm-config
              key: state-cache-ttl
        volumeMounts:
        - name: cache
          mountPath: /app/cache
        - name: output
          mountPath: /app/output
        - name: logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: llm-cache-pvc
      - name: output
        persistentVolumeClaim:
          claimName: llm-output-pvc
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-integration-module
  labels:
    app: llm-integration-module
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: metrics
  selector:
    app: llm-integration-module
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-config
data:
  openai-model: "gpt-4o-mini"
  openai-max-tokens: "2000"
  openai-temperature: "0.1"
  openai-rate-limit-rpm: "60"
  openai-timeout: "30"
  openai-max-retries: "3"
  state-cache-ttl: "300"
  state-refresh-interval: "60"
  intent-confidence-threshold: "0.7"
  max-clarification-attempts: "3"
  enable-action-simulation: "true"
  max-action-sequence-length: "50"
  action-timeout: "300"
  anomaly-detection-enabled: "true"
  anomaly-check-interval: "30"
  enable-input-sanitization: "true"
  max-intent-length: "1000"
  rate-limit-requests-per-minute: "60"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-cache-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-output-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
